[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ukpn-flex-savings"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "polars>=1.41.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "rich>=15.0.0",
    "structlog>=25.5.0",
    "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]   
ukpn-flex = "ukpn_flex_savings.cli.main:app"
